name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: Build and check size
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Use Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn

      - name: Install deps
        run: yarn install --immutable

      - name: Build
        run: yarn build

      - name: Check bundle size
        run: yarn size
